spring.application.name=MS-A
server.port=81

#  H2
# spring.datasource.url=jdbc:h2:mem:msa_db
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://10.13.29.99:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# MySQL
spring.datasource.url=jdbc:mysql://10.13.29.99:3306/
spring.datasource.username=logs
spring.datasource.password=logs
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.platform=mysql

# ===== Seguridad: Resource Server (JWT emitidos por el Authorization Server) =====
app.auth-server-url=${AUTH_SERVER_URL:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.auth-server-url}
# Origen del frontend permitido por CORS (separar con comas si son varios)
app.cors.allowed-origins=http://127.0.0.1:3000
