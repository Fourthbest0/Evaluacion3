spring.application.name=auth-server
server.port=9000

# Issuer: debe coincidir con spring.security.oauth2.resourceserver.jwt.issuer-uri de MS-A y MS-B
#noinspection SpringBootApplicationProperties
app.issuer=http://localhost:9000
# Origen del frontend (CORS para el endpoint /oauth2/token)
app.frontend-origin=http://127.0.0.1:3000
