spring.application.name=MS-B
server.port=82

# H2 (base propia, distinta a la de MS-A)
spring.datasource.url=jdbc:h2:mem:msb_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===== Seguridad: Resource Server (JWT emitidos por el Authorization Server) =====
app.auth-server-url=${AUTH_SERVER_URL:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.auth-server-url}
# Origen del frontend permitido por CORS (separar con comas si son varios)
app.cors.allowed-origins=http://127.0.0.1:3000
